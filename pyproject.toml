[project]
name = "optilift-vision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "luisiafk", email = "luise.cohalla@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "mediapipe==0.10.14",
    "numpy>=1.22.0",
    "opencv-python-headless>=4.8.0",
    "protobuf<5",
    "rich>=13.0.0",
    "scipy>=1.9.0",
]

[project.scripts]
optilift-vision = "optilift_vision:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
